<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - LINHAI RESIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html"><span class="logo-text">LINHAI RESIN</span></a>
      <a href="index.html" class="nav-link ms-auto">Back to Home</a>
    </div>
  </nav>

  <div class="container py-5 mt-4">
    <h1 class="red-underline text-center d-block">Contact Us</h1>
    
    <div class="row mt-5">
      <div class="col-lg-5 mb-5 mb-lg-0">
        <div class="p-4 bg-white shadow-sm h-100 border">
          <h3>Get In Touch</h3>
          <p class="mt-4"><strong>Address:</strong><br>No.123 Chemical Industry Zone, Jiangsu Province, China</p>
          <p><strong>Email:</strong><br><a href="mailto:info@linhairesin.com" style="color: var(--primary-red);">info@linhairesin.com</a></p>
          <p><strong>Phone:</strong><br>+86 123 4567 8900</p>
          
          <div class="mt-5">
            <img src="https://via.placeholder.com/400x300/eeeeee/000000?text=Google+Maps+Embed" class="img-fluid w-100 border" alt="Map">
          </div>
        </div>
      </div>
      
      <div class="col-lg-7">
        <div class="p-5 bg-white shadow-sm border h-100">
          <h3 class="mb-4">Send Us a Message</h3>
          <form id="contactForm">
            <div class="row mb-3">
              <div class="col-md-6"><label class="form-label">First Name *</label><input type="text" class="form-control" required></div>
              <div class="col-md-6 mt-3 mt-md-0"><label class="form-label">Last Name *</label><input type="text" class="form-control" required></div>
            </div>
            <div class="mb-3"><label class="form-label">Email Address *</label><input type="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Subject</label><input type="text" class="form-control"></div>
            <div class="mb-4"><label class="form-label">Message *</label><textarea class="form-control" rows="5" required></textarea></div>
            <button type="submit" class="btn btn-custom px-5 py-2">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/js/main.js"></script>
</body>
</html>
